# KRUMAQ-COPILOT — Nginx reverse proxy (alternative to Caddy)
#
# Usage with docker compose:
#   Replace the `caddy` service in docker-compose.yml with:
#
#   nginx:
#     image: nginx:stable-alpine
#     container_name: krumaq-nginx
#     restart: unless-stopped
#     ports:
#       - "80:80"
#       - "443:443"
#     volumes:
#       - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
#       - ./nginx/certs:/etc/nginx/certs:ro
#
# To generate a self-signed certificate for LAN use:
#   mkdir -p nginx/certs
#   openssl req -x509 -nodes -days 3650 -newkey rsa:4096 \
#     -keyout nginx/certs/krumaq.key \
#     -out nginx/certs/krumaq.crt \
#     -subj "/CN=krumaq.localhost"

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name krumaq.localhost;

        ssl_certificate     /etc/nginx/certs/krumaq.crt;
        ssl_certificate_key /etc/nginx/certs/krumaq.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # WebSocket support (required by Open WebUI)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;

        location / {
            proxy_pass http://open-webui:8080;
        }
    }
}
